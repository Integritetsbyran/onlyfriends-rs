# Workflow for releasing the relay binary. It is triggered by pushing a signed `relay/vX.Y.Z` tag,
# pointing to a signed commit. Trusted public keys are specified in github vars.
#
# The workflow does the following:
# - Verifies that tags and commits are signed.
# - Verifies that the version in the tag matches the `version` field in the crates.
# - Builds a docker image for onlyfriends-relay, and pushes it to ghcr.io
# - Creates a github release

name: release/onlyfriends-relay

on:
  push:
    tags:
      - 'relay/v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  RELAY_BIN: "onlyfriends-relay"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Fetch tag signatures
        run: git fetch origin tag "$GITHUB_REF_NAME" --force

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Import trusted GPG keys
        env:
          GPG_PUBLIC_KEYRING: ${{ vars.GPG_PUBLIC_KEYRING }}
        run: |
          # Create an isolated GPG home directory and import trusted keys
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          echo "$GPG_PUBLIC_KEYRING" | gpg --batch --import
          FINGERPRINTS=$(gpg --list-keys --with-colons | grep '^fpr' | cut -d: -f10)

          # Set ultimate trust for all imported keys
          while IFS= read -r fpr; do
            [ -n "$fpr" ] && echo "$fpr:6:" | gpg --batch --import-ownertrust
          done <<< "$FINGERPRINTS"

          # Persist GNUPGHOME for later steps
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Verify tag signature
        run: |
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          git cat-file -t "$GITHUB_REF_NAME"
          git for-each-ref --format='%(refname) %(objecttype) %(objectname)' "refs/tags/$GITHUB_REF_NAME"
          git verify-tag "$GITHUB_REF_NAME"

      - name: Verify commit signature
        run: git verify-commit "$GITHUB_SHA"

      - name: Extract version from git
        id: tag_version
        run: |
          VERSION=${GITHUB_REF_NAME#relay/v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Expected 'v1.2.3'"
            exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract relay version from cargo manifest
        id: relay_version
        run: |
          # extract `version = xxx` from onlyfriends-relay manifest
          VERSION="$(
            cargo metadata --no-deps --format-version=1 |
            jq -r '.packages[] | select(.name == "${{ env.RELAY_BIN }}").version'
          )"
          if [[ "$VERSION" == "null" || -z "$VERSION" ]]; then
            echo "Could not extract $RELAY_BIN version from Cargo.toml"
            exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Git tag matches crate version
        run: |
          if [[ "${{ steps.tag_version.outputs.v }}" != "${{ steps.relay_version.outputs.v }}" ]]; then
            echo "Git tag doesn't match $RELAY_BIN version: ${{ steps.tag_version.outputs.v }} != ${{ steps.relay_version.outputs.v }}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=relay-{{version}},match=v(\d.\d.\d)$
            type=semver,pattern=relay-{{major}}.{{minor}},match=v(\d.\d.\d)$
            type=semver,pattern=relay-{{major}},match=v(\d.\d.\d)$
            type=raw,value=latest,enable=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./relay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Docker image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:relay-${{ steps.tag_version.outputs.v }}\`"

