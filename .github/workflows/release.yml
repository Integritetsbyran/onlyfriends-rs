# Workflow for making releases. It is triggered by pushing a signed `vX.Y.Z` tag,
# pointing to a signed commit. Trusted public keys are specified in github secrets.
#
# The workflow does the following:
# - Verifies that tags and commits are signed.
# - Verifies that the version in the tag matches the `version` field in the crates.
# - Builds a docker image for onlyfriends-relay, and pushes it to ghcr.io
# - Creates a github release
#
# TODO:
# - Build and publish app for linux, android, and ios.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  RELAY_BIN: "onlyfriends-relay"
  RELAY_IMAGE: "onlyfriends/relay"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Needed for git verify-tag/commit

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Import trusted GPG keys
        env:
          GPG_PUBLIC_KEYRING: ${{ secrets.GPG_PUBLIC_KEYRING }}
        run: |
          # Create an isolated GPG home directory
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"

          # Import only the keys from your secret
          echo "$GPG_PUBLIC_KEYRING" | gpg --batch --import

          # Collect fingerprints of the keys we just imported
          FINGERPRINTS=$(gpg --list-keys --with-colons | grep '^fpr' | cut -d: -f10)

          # Set ultimate trust for all imported keys
          while IFS= read -r fpr; do
            [ -n "$fpr" ] && echo "$fpr:6:" | gpg --batch --import-ownertrust
          done <<< "$FINGERPRINTS"

          # Persist GNUPGHOME and allowed fingerprints for later steps
          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "ALLOWED_SIGNERS<<EOF"
            echo "$FINGERPRINTS"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Verify tag signature
        run: git verify-tag "$GITHUB_REF_NAME"

      - name: Verify commit signature
        run: git verify-commit "$GITHUB_SHA"

      - name: Extract version from git
        id: tag_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Expected 'v1.2.3'"
            exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract relay version from cargo manifest
        id: relay_version
        run: |
          # extract `version = xxx` from onlyfriends-relay manifest
          VERSION="$(
            cargo metadata --no-deps --format-version=1 |
            jq -r '.packages[] | select(.name == "${{ env.RELAY_BIN }}").version'
          )"
          if [[ "$VERSION" == "null" || -z "$VERSION" ]]; then
            echo "Could not extract $RELAY_BIN version from Cargo.toml"
            exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Git tag matches crate version
        run: |
          if [[ "${{ steps.tag_version.outputs.v }}" != "${{ steps.relay_version.outputs.v }}" ]]; then
            echo "Git tag doesn't match $RELAY_BIN version: ${{ steps.tag_version.outputs.v }} != ${{ steps.relay_version.outputs.v }}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.RELAY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./relay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ steps.tag_version.outputs.v}}" \
            --notes "Docker image: \`${{ env.REGISTRY }}/${{ env.RELAY_IMAGE }}:${{ steps.tag_version.outputs.v }}\`"

