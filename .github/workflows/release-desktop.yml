# Workflow for releasing the desktop app. It is triggered by pushing a signed `desktop/vX.Y.Z` tag,
# pointing to a signed commit. Trusted public keys are specified in github secrets.
#
# The workflow does the following:
# - Verifies that tags and commits are signed.
# - Verifies that the version in the tag matches the `version` field in the crates.
# - Builds flatpaks for onlyfriends-desktop (x86_64 and aarch64)
# - Creates a github release with the flatpaks included
# - Pushes to a flatpak repository

name: release/onlyfriends-desktop

on:
  push:
    tags:
      - 'desktop/v[0-9]+.[0-9]+.[0-9]+'

env:
  DESKTOP_BIN: "onlyfriends-desktop"

jobs:
  verify:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.tag_version.outputs.v }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Fetch tag signatures
        run: git fetch origin tag "$GITHUB_REF_NAME" --force

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Import trusted GPG keys
        env:
          GPG_PUBLIC_KEYRING: ${{ secrets.GPG_PUBLIC_KEYRING }}
        run: |
          # Create an isolated GPG home directory and import trusted keys
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          echo "$GPG_PUBLIC_KEYRING" | gpg --batch --import
          FINGERPRINTS=$(gpg --list-keys --with-colons | grep '^fpr' | cut -d: -f10)

          # Set ultimate trust for all imported keys
          while IFS= read -r fpr; do
            [ -n "$fpr" ] && echo "$fpr:6:" | gpg --batch --import-ownertrust
          done <<< "$FINGERPRINTS"

          # Persist GNUPGHOME for later steps
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Verify tag signature
        run: |
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          git cat-file -t "$GITHUB_REF_NAME"
          git for-each-ref --format='%(refname) %(objecttype) %(objectname)' "refs/tags/$GITHUB_REF_NAME"
          git verify-tag "$GITHUB_REF_NAME"

      - name: Verify commit signature
        run: git verify-commit "$GITHUB_SHA"

      - name: Extract version from git
        id: tag_version
        run: |
          VERSION=${GITHUB_REF_NAME#desktop/v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Expected 'v1.2.3'"
            exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract desktop version from cargo manifest
        id: desktop_version
        run: |
          # extract `version = xxx` from onlyfriends-desktop manifest
          VERSION="$(
            cargo metadata --no-deps --format-version=1 |
            jq -r '.packages[] | select(.name == "${{ env.DESKTOP_BIN }}").version'
          )"
          if [[ "$VERSION" == "null" || -z "$VERSION" ]]; then
            echo "Could not extract $DESKTOP_BIN version from Cargo.toml"
            exit 1
          fi
          echo "v=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Git tag matches crate version
        run: |
          if [[ "${{ steps.tag_version.outputs.v }}" != "${{ steps.desktop_version.outputs.v }}" ]]; then
            echo "Git tag doesn't match $DESKTOP_BIN version: ${{ steps.tag_version.outputs.v }} != ${{ steps.desktop_version.outputs.v }}"
            exit 1
          fi

  flatpak:
    name: "Build Flatpak"
    needs: verify
    container:
      # NOTE: keep in sync with flatpak manifest
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.integritetsbyran.OnlyFriends.${{ matrix.variant.arch }}.flatpak
          artifact-name: org.integritetsbyran.OnlyFriends.${{ matrix.variant.arch }}.flatpak
          manifest-path: ui/desktop/org.integritetsbyran.OnlyFriends.yml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: ${{ matrix.variant.arch }}
          verbose: true

  release:
    needs: [verify, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: bundles
          pattern: org.integritetsbyran.OnlyFriends.*.flatpak
          merge-multiple: true

      - name: List downloaded bundles
        run: ls -la bundles

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            bundles/*.flatpak

      - name: Push to flatpak repository
        env:
          FLATPAK_REPO_URL: ${{ secrets.FLATPAK_REPO_URL }}
          FLATPAK_REPO_API_KEY: ${{ secrets.FLATPAK_REPO_API_KEY }}
        run: |
          for b in bundles/*.flatpak; do
            echo "pushing $b"
            curl -v -XPOST -T "$b" "$FLATPAK_REPO_URL/flatpak-bundle/upload?key=$FLATPAK_REPO_API_KEY"
          done
