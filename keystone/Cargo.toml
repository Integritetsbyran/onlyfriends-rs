[package]
name = "keystone"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = "2"                                             # signatures / identity
x25519-dalek  = { version = "2", features = ["static_secrets"] } # DH — see note!
chacha20poly1305 = "0.10"                                       # AEAD (24-byte nonce)
hkdf = "0.12"                                                   # key derivation
sha2 = "0.10"                                                   # hash for HKDF
blake3 = "1"                                                    # content hashing (later)
rand = "0.8"                                                    # OS randomness
serde = { version = "1", features = ["derive"] }               # serialization
postcard = { version = "1", features = ["alloc"] }             # compact, deterministic
