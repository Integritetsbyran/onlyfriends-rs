[package]
name = "client-core"
version = "0.1.0"
edition = "2024"

[dependencies]
keystone = { path = "../keystone" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
rusqlite = { version = "0.31", features = ["bundled"] }
