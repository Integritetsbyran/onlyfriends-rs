[package]
name = "mobile"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
ui = { workspace = true }
client-core = { workspace = true }
storage-sqlite = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

# Used by `src/config.rs` to find a writable per-app data directory via
# `Context.getFilesDir()` — see the doc comment there.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]

